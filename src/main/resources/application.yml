logging:
  file:
    name: app.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      enabled: false # Полностью отключаем ротацию